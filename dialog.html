<script>/* パスワード照合用（SHA-256）。平文のパスワードはソースに書かない */
function smHash(s){var r=function(x,n){return(x>>>n)|(x<<(32-n))},K=[],H=[],p=2,c=0,i,j;while(c<64){for(i=2;i*i<=p;i++)if(p%i==0)break;if(i*i>p){if(c<8)H[c]=(Math.pow(p,.5)*4294967296)|0;K[c++]=(Math.pow(p,1/3)*4294967296)|0}p++}var b=unescape(encodeURIComponent(String(s))),L=b.length*8,w=[];b+='\x80';while(b.length%64-56)b+='\x00';for(i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<((3-i%4)*8);w.push((L/4294967296)|0,L|0);for(j=0;j<w.length;j+=16){var a=H.slice(0),W=w.slice(j,j+16);for(i=0;i<64;i++){if(i>15){var x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(r(x,7)^r(x,18)^(x>>>3))+W[i-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}var t1=(a[7]+(r(a[4],6)^r(a[4],11)^r(a[4],25))+((a[4]&a[5])^(~a[4]&a[6]))+K[i]+W[i])|0,t2=((r(a[0],2)^r(a[0],13)^r(a[0],22))+((a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2])))|0;a=[(t1+t2)|0].concat(a);a[4]=(a[4]+t1)|0;a.pop()}for(i=0;i<8;i++)H[i]=(H[i]+a[i])|0}var o='';for(i=0;i<8;i++)o+=('00000000'+(H[i]>>>0).toString(16)).slice(-8);return o}
</script>

function checkPw(){
  var PWS = ["0e70d8741e1e8092263591dba3c22416c5059d3c474e2de16e752c954ca43ec5","8c6adef88e647fabed40780543747c3649806677446abe01435ee189857481b9","eb6cc280035a7d7931731ebc08f855992e774cb79fe2ce8dbd80cdcef76274ac"];
  var v   = document.getElementById("pwInput").value.trim();
  var inp = document.getElementById("pwInput");
  var err = document.getElementById("pwError");
  if(PWS.indexOf(smHash(v))!==-1){
    sessionStorage.setItem("tdl_pw_ok","1");
    var ov = document.getElementById("pwOverlay");
    ov.classList.add("hide");
    setTimeout(function(){ ov.style.display="none"; },420);
  } else {
    err.textContent="パスワードが違います。記事をご確認ください。";
    inp.classList.add("shake");
    inp.value="";
    setTimeout(function(){ inp.classList.remove("shake"); err.textContent=""; inp.focus(); },500);
  }
}

              <div style={{ textAlign:"center", padding:"40px 20px", color:"#94a3b8", fontSize:14, fontWeight:700 }}>
                <div style={{ fontSize:48, marginBottom:12 }}>💬</div>
                ここにはまだプロンプトがありません
              </div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
                {filtered.map(prompt => {
                  const isFav  = favorites.includes(prompt.id);
                  const isUsed = used.includes(prompt.id);
                  const sit    = sitMap[prompt.situation];
                  return (
                    <div key={prompt.id} className="card" onClick={() => { setSelected(prompt); markUsed(prompt.id); }} style={{
                      background:"#fff", borderRadius:18, padding:"16px 18px",
                      boxShadow:"0 2px 8px rgba(0,0,0,0.05)",
                      borderLeft:`4px solid ${prompt.color}`,
                      opacity: isUsed ? 0.6 : 1,
                    }}>
                      <div style={{ display:"flex", alignItems:"flex-start", gap:10 }}>
                        <div style={{ flex:1 }}>
                          <div style={{ display:"flex", gap:6, marginBottom:8, flexWrap:"wrap" }}>
                            <span style={{ fontSize:11, fontWeight:800, background:`${prompt.color}15`, color:prompt.color, padding:"2px 8px", borderRadius:99 }}>
                              {sit?.icon} {sit?.label}
                            </span>
                            <span style={{ fontSize:11, fontWeight:800, background:"#f1f5f9", color:"#64748b", padding:"2px 8px", borderRadius:99 }}>
                              #{prompt.tag}
                            </span>
                            {isUsed && <span style={{ fontSize:11, fontWeight:800, background:"#f0fdf4", color:"#16a34a", padding:"2px 8px", borderRadius:99 }}>✅ つかった</span>}
                          </div>
                          <div style={{ fontSize:11, color:"#ef4444", fontWeight:800, marginBottom:4 }}>
                            🚫 よくある言い方：<span style={{ color:"#94a3b8", textDecoration:"line-through" }}>{prompt.ng}</span>
                          </div>
                          <div style={{ fontSize:15, fontWeight:900, color:"#1e293b" }}>💬 「{prompt.ok}」</div>
                        </div>
                        <button className="fav-btn" onClick={e => { e.stopPropagation(); toggleFav(prompt.id); }} style={{ fontSize:24, padding:4 }}>
                          {isFav ? "❤️" : "🤍"}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          {/* Modal */}
          {selected && (
            <div className="modal-bg" onClick={() => setSelected(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <div style={{ display:"flex", gap:8, marginBottom:20, flexWrap:"wrap", alignItems:"center" }}>
                  <span style={{ fontSize:12, fontWeight:800, background:`${selected.color}15`, color:selected.color, padding:"4px 12px", borderRadius:99 }}>
                    {sitMap[selected.situation]?.icon} {sitMap[selected.situation]?.label}
                  </span>
                  <span style={{ fontSize:12, fontWeight:800, background:"#f1f5f9", color:"#64748b", padding:"4px 12px", borderRadius:99 }}>
                    #{selected.tag}
                  </span>
                  <button className="fav-btn" onClick={() => toggleFav(selected.id)} style={{ marginLeft:"auto", fontSize:24, padding:"0 4px" }}>
                    {favorites.includes(selected.id) ? "❤️" : "🤍"}
                  </button>
                </div>

                <div style={{ background:"#fef2f2", borderRadius:16, padding:"14px 18px", marginBottom:16 }}>
                  <div style={{ fontSize:12, color:"#dc2626", fontWeight:800, marginBottom:6 }}>🚫 よくある言い方</div>
                  <div style={{ fontSize:17, fontWeight:800, color:"#7f1d1d", textDecoration:"line-through" }}>「{selected.ng}」</div>
                </div>

                <div style={{ background:"#f0fdf4", borderRadius:16, padding:"16px 18px", marginBottom:16, border:`2px solid ${selected.color}44` }}>
                  <div style={{ fontSize:12, color:"#16a34a", fontWeight:800, marginBottom:8 }}>✨ かわりのことば</div>
                  <div style={{ fontSize:22, fontWeight:900, color:"#14532d", lineHeight:1.4 }}>「{selected.ok}」</div>
                </div>

                <div style={{ background:"#faf5ff", borderRadius:14, padding:"14px 16px", marginBottom:20 }}>
                  <div style={{ fontSize:12, color:"#7c3aed", fontWeight:800, marginBottom:6 }}>💡 なぜ効くのか</div>
                  <div style={{ fontSize:14, color:"#4c1d95", lineHeight:1.6 }}>{selected.tip}</div>
                </div>

                <button className="btn" onClick={() => setSelected(null)} style={{
                  width:"100%", padding:"14px", borderRadius:14, fontSize:15, fontWeight:900,
                  background:"linear-gradient(135deg,#7c3aed,#a78bfa)", color:"#fff",
                }}>✕ とじる</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<DialogPrompt />);
  </script>
</body>
</html>
