<script>/* パスワード照合用（SHA-256）。平文のパスワードはソースに書かない */
function smHash(s){var r=function(x,n){return(x>>>n)|(x<<(32-n))},K=[],H=[],p=2,c=0,i,j;while(c<64){for(i=2;i*i<=p;i++)if(p%i==0)break;if(i*i>p){if(c<8)H[c]=(Math.pow(p,.5)*4294967296)|0;K[c++]=(Math.pow(p,1/3)*4294967296)|0}p++}var b=unescape(encodeURIComponent(String(s))),L=b.length*8,w=[];b+='\x80';while(b.length%64-56)b+='\x00';for(i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<((3-i%4)*8);w.push((L/4294967296)|0,L|0);for(j=0;j<w.length;j+=16){var a=H.slice(0),W=w.slice(j,j+16);for(i=0;i<64;i++){if(i>15){var x=W[i-15],y=W[i-2];W[i]=(W[i-16]+(r(x,7)^r(x,18)^(x>>>3))+W[i-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}var t1=(a[7]+(r(a[4],6)^r(a[4],11)^r(a[4],25))+((a[4]&a[5])^(~a[4]&a[6]))+K[i]+W[i])|0,t2=((r(a[0],2)^r(a[0],13)^r(a[0],22))+((a[0]&a[1])^(a[0]&a[2])^(a[1]&a[2])))|0;a=[(t1+t2)|0].concat(a);a[4]=(a[4]+t1)|0;a.pop()}for(i=0;i<8;i++)H[i]=(H[i]+a[i])|0}var o='';for(i=0;i<8;i++)o+=('00000000'+(H[i]>>>0).toString(16)).slice(-8);return o}
</script>

    <style>

        /* メインコンテンツ */
        #mainContent {

        .header {

            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;

        .observation-points h4 {

            color: #f57c00;
            margin-bottom: 10px;
        }

        .observation-points ul {
            list-style: none;
            padding-left: 0;
        }

        .observation-points li {
            padding: 8px 0;
            padding-left: 20px;

            position: relative;
        }

        .observation-points li:before {
            content: "📊";

        }

        .action-buttons {
            display: flex;
            gap: 10px;

        }

        .btn-save, .btn-edit {
            flex: 1;
            padding: 12px;

        }

        }

        }

        .history-section {

        }

        .history-item {
            background: #f9f9f9;

            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .history-date {
            font-size: 12px;
            color: #999;
        }

        .history-problem {
            font-size: 13px;

        }

        .edit-modal.show {

        .modal-content {
            background: white;

            max-height: 80vh;

        }

        .modal-content h3 {

        }

        .modal-content textarea {
            width: 100%;

            border: 2px solid #e0e0e0;

            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;

        @media (max-width: 768px) {

            .main-card {

    </style>
</head>
<body>
    <!-- パスワード入力画面 -->
    <div id="passwordScreen">
        <h2>🔄 問題→データ変換アプリ</h2>
        <p>このツールにアクセスするにはパスワードが必要です</p>
        <input type="password" id="passwordInput" placeholder="パスワードを入力" onkeypress="if(event.key==='Enter') checkPassword()">
        <br>
        <button onclick="checkPassword()">ログイン</button>
        <p class="error-message" id="errorMessage">パスワードが正しくありません</p>
    </div>

    <!-- メインコンテンツ -->
    <div id="mainContent">
        <div class="container">
            <div class="header">
                <h1>🔄 問題→データ変換アプリ</h1>
                <p>「困った行動」を「才能の観察対象」に変えるツール</p>
            </div>
            
            <div class="main-card">
                <div class="quick-buttons">
                    <h3>よくある「困った行動」から選ぶ</h3>
                    <div class="button-grid">
                        <button class="quick-btn" onclick="selectQuickProblem('ゲームばっかりやってる')">ゲーム依存</button>
                        <button class="quick-btn" onclick="selectQuickProblem('YouTube無限に見てる')">YouTube漬け</button>
                        <button class="quick-btn" onclick="selectQuickProblem('昼夜逆転してる')">昼夜逆転</button>
                        <button class="quick-btn" onclick="selectQuickProblem('朝起きない')">朝起きない</button>
                        <button class="quick-btn" onclick="selectQuickProblem('暴言を吐く')">暴言・癇癪</button>
                        <button class="quick-btn" onclick="selectQuickProblem('偏食がひどい')">偏食</button>
                        <button class="quick-btn" onclick="selectQuickProblem('こだわりが強すぎる')">強いこだわり</button>
                        <button class="quick-btn" onclick="selectQuickProblem('友達と遊ばない')">孤立</button>
                    </div>
                </div>
                
                <div class="input-section">
                    <label>または、今困っている行動を自由に書いてください</label>
                    <textarea id="problem-input" placeholder="例: 宿題を全くやらない、部屋に引きこもってる、など"></textarea>
                </div>
                
                <button class="convert-btn" onclick="convertProblem()">🔄 データに変換する</button>
                
                <div class="result-section" id="result-section">
                    <div class="transformation">
                        <div class="problem-box">
                            <div class="problem-label">❌ 問題として見た時</div>
                            <div class="problem-text" id="problem-display"></div>
                        </div>
                        
                        <div class="arrow">↓</div>
                        
                        <div class="data-box">
                            <div class="data-label">✅ データとして見た時</div>
                            <div class="data-text" id="data-display"></div>
                        </div>
                        
                        <div class="observation-points">
                            <h4>📊 観察・記録すべきポイント</h4>
                            <ul id="observation-list"></ul>
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn-save" onclick="saveConversion()">💾 変換結果を保存</button>
                        <button class="btn-edit" onclick="openEditModal()">✏️ 編集する</button>
                    </div>
                </div>
            </div>
            
            <div class="main-card history-section" id="history-section" style="display:none;">
                <h3 style="margin-bottom: 15px; color: #333;">📚 保存した変換履歴</h3>
                <div id="history-list"></div>
            </div>
        </div>

        <div class="edit-modal" id="edit-modal">
            <div class="modal-content">
                <h3>変換結果を編集</h3>
                <label style="display: block; margin-bottom: 8px; font-size: 14px; color: #666;">データとしての見方</label>
                <textarea id="edit-data" rows="3"></textarea>
                <label style="display: block; margin-bottom: 8px; font-size: 14px; color: #666;">観察ポイント(1行に1つずつ)</label>
                <textarea id="edit-observations" rows="5"></textarea>
                <div class="modal-buttons">
                    <button class="modal-save" onclick="saveEdit()">保存</button>
                    <button class="modal-cancel" onclick="closeEditModal()">キャンセル</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // パスワードチェック機能
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const correctPassword = '1b6049535372fd3d534acfa789b778a8e2b70dea8341b1b0934428a004eb551a';
            
            if (smHash(password) === correctPassword) {
                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('errorMessage').style.display = 'none';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // メインアプリケーションのコード
        const conversions = {
            'ゲームばっかりやってる': {
                data: '驚異的な集中力と戦略的思考能力の発揮',
                observations: [
                    '何時間連続で集中できるか',
                    'どんなジャンルのゲームを選ぶか(戦略系、アクション系、創作系など)',
                    '攻略法を自分で編み出しているか',
                    'ゲーム中の表情や感情の変化',
                    'マルチプレイでのコミュニケーション能力'
                ]
            },
            'YouTube無限に見てる': {
                data: '情報収集能力と興味・関心の方向性の分析',
                observations: [
                    'どんなジャンルの動画を見ているか',
                    '同じ系統の動画を見続けるか、色々なジャンルを見るか',
                    '動画の長さの傾向(短い動画 vs 長時間動画)',
                    '見た後の反応(笑う、考え込む、真似する など)',
                    '動画の内容について話すか'
                ]
            },
            '昼夜逆転してる': {
                data: '活動エネルギーのピークタイム測定と生体リズムの特性把握',
                observations: [
                    '実際の就寝時刻と起床時刻',
                    '夜間の活動内容と集中度',
                    '日中の眠気のパターン',
                    '食事のタイミングと食欲',
                    '週末と平日の差'
                ]
            },
            '朝起きない': {
                data: '最適な覚醒タイミングと睡眠サイクルの特性分析',
                observations: [
                    '何時になれば自然に起きるか',
                    '起きた時の機嫌や体調',
                    '前日の就寝時刻との関係',
                    '季節や天候による変化',
                    '起床後の活動開始までの時間'
                ]
            },
            '暴言を吐く': {
                data: '感情表現のパターンとストレス反応の可視化',
                observations: [
                    'どんな状況で暴言が出るか(朝、疲れた時、思い通りにいかない時など)',
                    '暴言の前兆となる行動や表情',
                    '暴言を吐いた後の様子',
                    '何を言われると落ち着くか',
                    '暴言が出ない日の共通点'
                ]
            },
            '偏食がひどい': {
                data: '感覚特性と食の好みパターンの研究',
                observations: [
                    '食べられるものの共通点(食感、色、温度など)',
                    '食べられないものの共通点',
                    '調理法による違い(生 vs 加熱、など)',
                    '環境による変化(外食 vs 家、など)',
                    '新しい食べ物への挑戦頻度'
                ]
            },
            'こだわりが強すぎる': {
                data: '独自の価値観とルール体系の構築能力',
                observations: [
                    'どんなことにこだわるか(順番、配置、時間など)',
                    'こだわりが満たされた時の反応',
                    'こだわりを崩された時の対処法',
                    'こだわりの変化や進化',
                    '他者のこだわりへの反応'
                ]
            },
            '友達と遊ばない': {
                data: '対人距離感の設定能力と単独活動への適性',
                observations: [
                    '一人で何をして過ごすか',
                    '集団にいる時の様子(観察している、避けている、など)',
                    '特定の人とだけ関わることはあるか',
                    'オンラインでのコミュニケーションはどうか',
                    '一人の時間の後の様子'
                ]
            }
        };

        let currentConversion = null;
        let savedHistory = [];

        function selectQuickProblem(problem) {
            document.getElementById('problem-input').value = problem;
        }

        function convertProblem() {
            const input = document.getElementById('problem-input').value.trim();
            
            if (!input) {
                alert('困っている行動を入力してください');
                return;
            }
            
            let conversion = conversions[input];
            
            if (!conversion) {
                conversion = generateCustomConversion(input);
            }
            
            currentConversion = {
                problem: input,
                data: conversion.data,
                observations: conversion.observations,
                timestamp: new Date()
            };
            
            displayResult(currentConversion);
        }

        function generateCustomConversion(problem) {
            const patterns = [
                { keywords: ['しない', 'やらない'], data: '自己選択能力と優先順位の判断', observations: ['何を選んでいるか', 'どんな時なら取り組むか', '代わりに何をしているか'] },
                { keywords: ['すぐ', 'イライラ', '怒る'], data: '感情の起伏パターンと発散方法の分析', observations: ['何がきっかけか', '怒った後の行動', '落ち着くまでの時間'] },
                { keywords: ['集中', '没頭'], data: '高い集中力と没入能力', observations: ['何に集中しているか', '集中している時間', '中断時の反応'] }
            ];
            
            for (let pattern of patterns) {
                if (pattern.keywords.some(kw => problem.includes(kw))) {
                    return {
                        data: pattern.data,
                        observations: pattern.observations
                    };
                }
            }
            
            return {
                data: '独自の行動パターンと特性の表れ',
                observations: [
                    'いつ、どんな時にその行動をするか',
                    'その行動をしている時の様子',
                    'その行動の前後の変化',
                    'その行動が起きない日の共通点'
                ]
            };
        }

        function displayResult(conversion) {
            document.getElementById('problem-display').textContent = conversion.problem;
            document.getElementById('data-display').textContent = conversion.data;
            
            const observationList = document.getElementById('observation-list');
            observationList.innerHTML = '';
            conversion.observations.forEach(obs => {
                const li = document.createElement('li');
                li.textContent = obs;
                observationList.appendChild(li);
            });
            
            const resultSection = document.getElementById('result-section');
            resultSection.classList.add('show');
            
            resultSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function saveConversion() {
            if (!currentConversion) return;
            
            savedHistory.unshift(currentConversion);
            renderHistory();
            
            alert('保存しました!');
        }

        function renderHistory() {
            if (savedHistory.length === 0) {
                document.getElementById('history-section').style.display = 'none';
                return;
            }
            
            document.getElementById('history-section').style.display = 'block';
            
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            
            savedHistory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-header">
                        <div class="history-date">${item.timestamp.toLocaleDateString('ja-JP')} ${item.timestamp.toLocaleTimeString('ja-JP', {hour: '2-digit', minute: '2-digit'})}</div>
                        <button class="delete-history" onclick="deleteHistory(${index})">削除</button>
                    </div>
                    <div class="history-problem">問題: ${item.problem}</div>
                    <div class="history-data">→ ${item.data}</div>
                `;
                historyList.appendChild(div);
            });
        }

        function deleteHistory(index) {
            if (confirm('この履歴を削除しますか?')) {
                savedHistory.splice(index, 1);
                renderHistory();
            }
        }

        function openEditModal() {
            if (!currentConversion) return;
            
            document.getElementById('edit-data').value = currentConversion.data;
            document.getElementById('edit-observations').value = currentConversion.observations.join('\n');
            document.getElementById('edit-modal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.remove('show');
        }

        function saveEdit() {
            const newData = document.getElementById('edit-data').value.trim();
            const newObservations = document.getElementById('edit-observations').value
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
            
            if (!newData || newObservations.length === 0) {
                alert('データと観察ポイントを入力してください');
                return;
            }
            
            currentConversion.data = newData;
            currentConversion.observations = newObservations;
            
            displayResult(currentConversion);
            closeEditModal();
        }

        document.getElementById('edit-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
